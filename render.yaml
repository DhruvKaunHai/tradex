services:
  - type: web
    name: tradex
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server/index.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "1149546127"
      - key: TELEGRAM_FRIEND_IDS
        value: "1148568929"

